# uv workspace 루트 (기획서 13-2). 서비스별 의존성은 각 멤버 pyproject.toml에 둔다.
# 의존성 추가: uv add --package <멤버 이름> <패키지>
[project]
name = "dejafix"
version = "0.1.0"
description = "DejaFix uv workspace root"
requires-python = ">=3.12,<3.13"
# 루트에서 `uv sync` 한 번으로 모든 멤버를 설치하기 위해 멤버 전부를 의존성으로 둔다.
dependencies = [
    "backend",
    "agent",
    "mcp-zabbix",
    "scheduler",
    "zabbix-ro",
    "shared-db",
    "kb",
    "mcp-kb",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "backend",
    "agent",
    "mcp-zabbix",
    "scheduler",
    "libs/zabbix_ro",
    "libs/shared_db",
    "libs/kb",
    "mcp-kb",
]

[tool.uv.sources]
backend = { workspace = true }
agent = { workspace = true }
mcp-zabbix = { workspace = true }
scheduler = { workspace = true }
zabbix-ro = { workspace = true }
shared-db = { workspace = true }
kb = { workspace = true }
mcp-kb = { workspace = true }

[tool.ruff]
target-version = "py312"
# 기획서 13-5에 line-length 등 지정이 없어 ruff 기본값을 쓴다.
# 다만 ruff 버전에 따라 기본 대상·규칙이 바뀌므로 고전 기본값을 명시해 PC마다 같은 결과를 낸다.
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
# 멤버마다 tests/test_import.py처럼 이름이 겹쳐도 충돌하지 않게 importlib 모드 사용
addopts = ["--import-mode=importlib"]
testpaths = [
    "backend/tests",
    "agent/tests",
    "mcp-zabbix/tests",
    "scheduler/tests",
    "libs/zabbix_ro/tests",
    "libs/shared_db/tests",
    "libs/kb/tests",
    "mcp-kb/tests",
]
markers = [
    "safety_regression: 안전 회귀 세트",
]
