; dejafix-app: 4프로세스를 supervisord 가 띄우고, 하나가 죽으면 그 프로세스만 되살린다(autorestart).
; - 로그는 전부 컨테이너 stdout 으로(docker logs). 프로세스 이름이 로그 앞에 붙지 않으므로 각 서비스 로그의 logger 이름으로 구분.
; - 환경변수는 컨테이너 환경(compose env_file + environment)을 그대로 상속한다(supervisord 는 clean_environment 를 켜지 않음).
; - 서비스 간 주소는 모두 127.0.0.1. agent·mcp-zabbix 는 컨테이너 밖으로 열지 않는다(loopback 바인딩).
; - startsecs=3: 3초 안에 죽으면 실패로 보고 백오프(1,2,3초…)하며 startretries=10 회 재시도. 그래도 못 뜨면 FATAL.
; - FATAL 이 되면 fatal-listener 가 supervisord 를 종료시켜 컨테이너가 끝나고, compose 의 restart: unless-stopped 가 전체를 다시 띄운다.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:mcp-zabbix]
command=python -m mcp_zabbix
directory=/app
environment=MCP_ZABBIX_HOST="127.0.0.1",MCP_ZABBIX_PORT="8200"
priority=10
autostart=true
autorestart=true
startsecs=3
startretries=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:agent]
command=uvicorn dejafix_agent.main:app --host 127.0.0.1 --port 8100
directory=/app
priority=20
autostart=true
autorestart=true
startsecs=3
startretries=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:backend]
command=uvicorn dejafix_backend.main:app --host 0.0.0.0 --port 8000
directory=/app
priority=30
autostart=true
autorestart=true
startsecs=3
startretries=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:scheduler]
command=python -m dejafix_scheduler
directory=/app
priority=40
autostart=true
autorestart=true
startsecs=3
startretries=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[eventlistener:fatal]
command=python /app/infra/docker/fatal-listener.py
events=PROCESS_STATE_FATAL
autorestart=true
startsecs=0
redirect_stderr=false
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
