[project]
name = "agent"
version = "0.1.0"
description = "DejaFix AI Agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "mcp>=2.3.0",
    "pyyaml>=6.0.3",
    "shared-db",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dejafix_agent"
module-root = ""

[tool.uv.sources]
shared-db = { workspace = true }
