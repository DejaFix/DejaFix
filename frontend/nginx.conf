# frontend 컨테이너 nginx (T26). 외부 공개는 이 컨테이너 :80 → 호스트 8080 하나뿐 (SAFE-14).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /api/* → backend (compose 서비스 이름). 브라우저는 상대 경로 /api 만 쓴다.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        # 채팅 SSE(text/event-stream): 버퍼링 끄고 오래 기다림
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    # SPA fallback: 메일 링크(/incidents/:id) 직접 진입 시 404 방지 (FR-FE-016)
    location / {
        try_files $uri /index.html;
    }
}
