[project]
name = "scheduler"
version = "0.1.0"
description = "DejaFix Scheduler (Problem 폴링 배치)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "shared-db",
    "zabbix-ro",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# 폴더 이름(scheduler/)과 같으면 pytest importlib 모드가 폴더를 namespace 패키지로 잡아
# 실제 패키지를 가린다 → 다른 서비스(dejafix_agent·dejafix_backend)처럼 접두사를 붙인다.
module-name = "dejafix_scheduler"
module-root = ""

[tool.uv.sources]
zabbix-ro = { workspace = true }
shared-db = { workspace = true }
