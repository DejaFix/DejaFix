[project]
name = "scheduler"
version = "0.1.0"
description = "DejaFix Scheduler (Problem 폴링 배치)"
requires-python = ">=3.12,<3.13"
dependencies = ["zabbix-ro"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scheduler"
module-root = ""

[tool.uv.sources]
zabbix-ro = { workspace = true }
