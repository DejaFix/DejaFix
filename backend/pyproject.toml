[project]
name = "backend"
version = "0.1.0"
description = "DejaFix Backend (FastAPI BFF)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "zabbix-ro",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "httpx>=0.27",
    # Incident 응답을 contracts/incident.schema.json 으로 검증하는 테스트용(FR-DATA-006)
    "jsonschema>=4.23",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dejafix_backend"
module-root = ""

[tool.uv.sources]
zabbix-ro = { workspace = true }
